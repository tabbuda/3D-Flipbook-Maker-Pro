<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="left-page-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="right-page-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f766e"/>
      <stop offset="100%" stop-color="#134e4a"/>
    </linearGradient>
    <linearGradient id="turning-leaf-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="70%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bg-grad)"/>
  <rect width="508" height="508" x="2" y="2" rx="110" fill="none" stroke="#10b981" stroke-opacity="0.3" stroke-width="4"/>

  <!-- Subtle glow background circle -->
  <circle cx="256" cy="256" r="160" fill="#10b981" fill-opacity="0.12" filter="url(#glow)"/>

  <!-- Left Leaf -->
  <path d="M 110 140 Q 240 160 256 168 L 256 388 Q 240 376 110 360 Z" fill="url(#left-page-grad)" filter="drop-shadow(0 10px 20px rgba(0,0,0,0.5))"/>
  
  <!-- Left Leaf Text Lines -->
  <line x1="135" y1="200" x2="225" y2="208" stroke="#f0fdf4" stroke-width="8" stroke-linecap="round" stroke-opacity="0.9"/>
  <line x1="135" y1="230" x2="225" y2="238" stroke="#d1fae5" stroke-width="7" stroke-linecap="round" stroke-opacity="0.75"/>
  <line x1="135" y1="260" x2="205" y2="267" stroke="#d1fae5" stroke-width="7" stroke-linecap="round" stroke-opacity="0.75"/>
  <line x1="135" y1="290" x2="215" y2="297" stroke="#d1fae5" stroke-width="7" stroke-linecap="round" stroke-opacity="0.6"/>

  <!-- Right Leaf -->
  <path d="M 402 140 Q 272 160 256 168 L 256 388 Q 272 376 402 360 Z" fill="url(#right-page-grad)" filter="drop-shadow(0 10px 20px rgba(0,0,0,0.5))"/>
  
  <!-- Right Leaf Text Lines -->
  <line x1="287" y1="208" x2="377" y2="200" stroke="#f0fdf4" stroke-width="8" stroke-linecap="round" stroke-opacity="0.9"/>
  <line x1="287" y1="238" x2="377" y2="230" stroke="#d1fae5" stroke-width="7" stroke-linecap="round" stroke-opacity="0.75"/>
  <line x1="287" y1="268" x2="357" y2="260" stroke="#d1fae5" stroke-width="7" stroke-linecap="round" stroke-opacity="0.75"/>
  <line x1="287" y1="298" x2="367" y2="290" stroke="#d1fae5" stroke-width="7" stroke-linecap="round" stroke-opacity="0.6"/>

  <!-- Spine Center -->
  <path d="M 252 164 L 260 164 L 260 392 L 252 392 Z" fill="#34d399" opacity="0.9"/>

  <!-- Turning 3D Leaf in Middle -->
  <path d="M 256 168 C 280 120, 360 150, 370 200 L 330 380 C 310 360, 270 375, 256 388 Z" fill="url(#turning-leaf-grad)" filter="drop-shadow(-8px 12px 18px rgba(0,0,0,0.6))"/>

  <!-- 3D Ribbon badge / spark -->
  <polygon points="256,120 264,136 280,140 267,152 270,168 256,160 242,168 245,152 232,140 248,136" fill="#facc15" filter="drop-shadow(0 2px 8px rgba(250,204,21,0.6))"/>
</svg>
